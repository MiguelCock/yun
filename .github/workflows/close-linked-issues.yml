name: Close linked issues

on:
  pull_request:
    types: [closed]

permissions:
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced with closing keywords
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          numbers=$(printf '%s' "$PR_BODY" \
            | grep -ioE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -un)
          for n in $numbers; do
            echo "Closing #$n (via PR #$PR_NUMBER -> $BASE_REF)"
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Closed by #$PR_NUMBER." || echo "Could not close #$n"
          done
